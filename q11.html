<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 11</title>
</head>
<body>
    <script>
var val1 = +prompt("Enter first number:");
var val2 = +prompt("Enter second number:");
var op = prompt("Enter operation (+, -, *, /, %):");

if (op === "+") {
    alert(val1 + val2);
} else if (op === "-") {
    alert(val1 - val2);
} else if (op === "*") {
    alert(val1 * val2);
} else if (op === "/") {
    alert(val1 / val2);
} else if (op === "%") {
    alert(val1 % val2);
}

    </script>
</body>
</html>
