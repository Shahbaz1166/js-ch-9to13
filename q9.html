    <title>Question 9</title>

  <body>
    <script>
      var n = +prompt("Enter a number to check Even or Odd:");
      if (n % 2 === 0) {
        alert("This is an Even number");
      } else {
        alert("This is an Odd number");
      }
    </script>
  </body>
